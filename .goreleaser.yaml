# goreleaser configuration.
#   local check:  goreleaser check
#   dry run:      goreleaser release --snapshot --clean
version: 2

project_name: skeptic

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: skeptic
    main: ./cmd/skeptic
    binary: skeptic
    env:
      # A static binary is the point: the target user drops it into CI with no
      # Go or Python environment present.
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/bugyal/skeptic/internal/version.Version={{.Version}}
      - -X github.com/bugyal/skeptic/internal/version.Commit={{.Commit}}
      - -X github.com/bugyal/skeptic/internal/version.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: skeptic
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      # Apache-2.0 section 4(d): the NOTICE file travels with the work.
      - NOTICE
      - CHANGELOG.md
      - docs/report-schema.json

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?:'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^chore:'
      - '^test:'
      - Merge pull request

# Homebrew: `brew install bugyal/tap/skeptic`. Inert until the owner creates
# the bugyal/homebrew-tap repository and stores a token that can write to it
# as the HOMEBREW_TAP_GITHUB_TOKEN secret. Without the token, upload is
# skipped and the release is unaffected. See docs/decisions.md D22.
homebrew_casks:
  - name: skeptic
    repository:
      owner: bugyal
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # auto: upload for releases, skip prereleases.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/bugyal/skeptic
    description: Checks whether AI coding benchmarks measure what they claim
    license: Apache-2.0
    # Deliberately no dependency on Docker: `skeptic lint` needs no container
    # runtime, and forcing one on people who only want the static checks is
    # the wrong trade.
    hooks:
      post:
        # The binary is not signed or notarized, so macOS refuses to run it
        # from a quarantined download ("is damaged and cannot be opened").
        # This is goreleaser's documented alternative to notarization; the
        # other is to sign and notarize, which needs a paid Apple account.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/skeptic"]
          end

release:
  draft: true
  prerelease: auto
  footer: |
    ## Verifying a benchmark with this build

    ```sh
    skeptic lint  ./tasks     # static checks, no Docker
    skeptic check ./tasks     # the oracle and nop controls
    ```

    Report format is versioned; the schema ships in the archive as
    `docs/report-schema.json`.
