# Merged on top of Harbor's base file, which defines main. The api sidecar
# holds the answer; main may only start once it is healthy.
services:
  main:
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/secret.txt', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 20
