name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.25 is the minimum supported toolchain, 1.26 the current release.
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # The staticcheck job runs once, not per Go version: the finding does
        # not depend on the toolchain.
        if: matrix.go-version == '1.26'
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: unit tests
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: lint examples
        # The showcase tasks must stay lint-clean: any FAIL here is a
        # regression in either the examples or the checks themselves.
        run: |
          go build -o skeptic ./cmd/skeptic
          ./skeptic lint ./examples/clean
          ./skeptic lint ./examples/no-oracle
          ./skeptic lint ./examples/honest-echo

  e2e:
    # Needs a Docker daemon and builds images, so it is opt-in rather than
    # running on every pull request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # An e2e failure is often the runner, not the code: how much swap it
      # has and whether its kernel accounts for it decide whether a memory
      # limit kills a process or lets it swap.
      - name: host facts
        run: |
          free -m
          docker info 2>&1 | grep -i -E 'cgroup|swap|warning' || true
          docker run --rm --memory 64m python:3.12-slim sh -c 'cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.memsw.limit_in_bytes' || true
          echo "--- 300 MB under --memory 64m"
          docker run --rm --memory 64m python:3.12-slim python3 -c 'b=bytearray(300*1024*1024); print("survived")'; echo "exit=$?"
          echo "--- 300 MB under --memory 64m --memory-swap 64m"
          docker run --rm --memory 64m --memory-swap 64m python:3.12-slim python3 -c 'b=bytearray(300*1024*1024); print("survived")'; echo "exit=$?"
      - name: e2e tests
        run: go test -tags e2e -timeout 30m ./e2e/...